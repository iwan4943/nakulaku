<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#B3261E">
    <title>System Optimization | Nakulaku</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { 
                        nakula: { 50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 500: '#f43f5e', 600: '#B3261E', 700: '#9f1239', 800: '#881337', 900: '#4c0519' },
                        darkbg: '#121212', darkcard: '#1E1E1E'
                    }, 
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                } 
            }
        }
    </script>

    <style>
        body { overflow: hidden; user-select: none; }
        
        /* Background Animations */
        .blob { position: absolute; filter: blur(60px); z-index: -1; opacity: 0.5; border-radius: 50%; }
        .blob-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: #B3261E; animation: float 10s infinite alternate; }
        .blob-2 { bottom: -10%; right: -10%; width: 250px; height: 250px; background: #f43f5e; animation: float 8s infinite alternate-reverse; }
        @keyframes float { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(30px, 30px) rotate(10deg); } }

        /* Progress Bar */
        .progress-container { width: 100%; height: 6px; background: rgba(0,0,0,0.05); border-radius: 99px; overflow: hidden; margin-top: 2rem; }
        .dark .progress-container { background: rgba(255,255,255,0.1); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #B3261E, #f43f5e); width: 0%; transition: width 2s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 99px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen bg-slate-50 dark:bg-darkbg text-stone-800 dark:text-white relative transition-colors duration-300">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="relative z-10 w-full max-w-sm p-8 mx-6 bg-white/70 dark:bg-darkcard/70 backdrop-blur-xl border border-white/50 dark:border-white/10 rounded-[2.5rem] shadow-2xl text-center transform transition-all">
        
        <div class="w-20 h-20 mx-auto mb-6 bg-gradient-to-br from-nakula-600 to-nakula-800 rounded-3xl flex items-center justify-center shadow-lg shadow-nakula-600/30 text-white animate-pulse-slow">
            <i data-lucide="sparkles" class="w-10 h-10"></i>
        </div>

        <h1 class="text-2xl font-black mb-2 tracking-tight">Optimasi Sistem</h1>
        <p class="text-sm font-medium text-stone-500 dark:text-stone-400 leading-relaxed">
            Mendeteksi pembaruan, membersihkan memori lama, dan menyinkronkan data...
        </p>

        <div class="progress-container">
            <div id="p-bar" class="progress-fill"></div>
        </div>
        
        <div class="mt-4 flex justify-between items-center px-1">
            <span class="text-[10px] font-bold text-stone-400 uppercase tracking-widest">Nakulaku v58.5</span>
            <span id="percent-text" class="text-[10px] font-bold text-nakula-600 dark:text-nakula-500">0%</span>
        </div>
    </div>

    <div class="absolute bottom-8 text-center w-full opacity-60">
        <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-stone-500">Solid Bersinergi Menginspirasi</p>
    </div>

    <script>
        // --- LOGIKA UTAMA ---
        window.onload = function() {
            lucide.createIcons();
            
            // Cek Mode Gelap System
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }

            const bar = document.getElementById('p-bar');
            const txt = document.getElementById('percent-text');
            
            // 1. Jalankan animasi loading
            setTimeout(() => {
                bar.style.width = "100%";
                txt.innerText = "100%";
            }, 300);

            // 2. Redirect Otomatis ke index.html dengan sinyal #reset
            setTimeout(function() {
                // Mendapatkan URL path saat ini, lalu ganti nama file akhirnya menjadi index.html
                let path = window.location.pathname;
                let newPath = path.substring(0, path.lastIndexOf('/')) + "/index.html";
                
                // Jika dibuka di root (tanpa nama file), arahkan ke ./index.html
                if(newPath.endsWith('//index.html')) newPath = "./index.html";

                // LEMPAR USER KE: index.html#reset
                window.location.replace(newPath + "#reset");
            }, 2200); // Waktu tunggu 2.2 detik agar animasi selesai
        };
    </script>
</body>
</html>
