<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Capaian KKG — Gugus Nakula 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
:root{
  --primary:#B3261E; --primary-dark:#8B1C16; --primary-light:#FCEAE9;
  --bg:#FAFAFA; --bg-elevated:#FFFFFF;
  --border:#EBEBEF; --border-strong:#D9D9E0;
  --text:#121217; --text-secondary:#5A5A66; --text-tertiary:#8E8E99;
  --gold:#D4A017; --gold-bg:linear-gradient(135deg,#FFF9E6 0%,#FFEDC2 100%); --gold-border:#F4D88A;
  --success:#10B981; --success-bg:#E7F6EE; --success-text:#0F7A44;
  --warning:#F59E0B; --warning-bg:#FFF4E5; --warning-text:#A16207;
  --danger:#DC2626; --danger-bg:#FEE2E2; --danger-text:#991B1B;
  --purple:#8B5CF6; --purple-bg:#F5F3FF; --purple-border:#C4B5FD; --purple-text:#4C1D95;
  --shadow-sm:0 1px 2px rgba(18,18,23,0.04);
  --shadow-md:0 4px 12px rgba(18,18,23,0.06);
  --shadow-lg:0 12px 32px rgba(18,18,23,0.08);
  --shadow-xl:0 24px 60px rgba(18,18,23,0.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-0.02em;}
.hidden{display:none !important;}

/* ==== LOGIN ==== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#F5F3FF 0%,#EDE9FE 50%,#FCE7F3 100%);position:relative;overflow:hidden;}
.login-wrap::before{content:"";position:absolute;top:-30%;left:-10%;width:700px;height:700px;background:radial-gradient(circle,rgba(139,92,246,0.15) 0%,transparent 70%);pointer-events:none;}
.login-wrap::after{content:"";position:absolute;bottom:-30%;right:-10%;width:700px;height:700px;background:radial-gradient(circle,rgba(179,38,30,0.1) 0%,transparent 70%);pointer-events:none;}
.login-card{background:white;border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(18,18,23,0.12);position:relative;z-index:1;}
.login-brand{text-align:center;margin-bottom:28px;}
.login-brand-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:white;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 12px 32px rgba(179,38,30,0.3);}
.login-brand-icon svg{width:32px;height:32px;}
.login-brand h1{font-size:1.35rem;font-weight:800;margin-bottom:4px;}
.login-brand p{font-size:0.85rem;color:var(--text-tertiary);font-weight:500;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-secondary);margin-bottom:8px;}
.form-input{width:100%;padding:14px 18px;border:1.5px solid var(--border-strong);border-radius:12px;font-family:'Plus Jakarta Sans',monospace;font-size:1.4rem;font-weight:700;outline:none;letter-spacing:0.5em;text-align:center;background:white;transition:0.15s;}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(179,38,30,0.1);}
.form-input::placeholder{letter-spacing:0.15em;color:#B8B8C0;font-size:1rem;}
.form-hint{font-size:0.72rem;color:var(--text-tertiary);margin-top:8px;text-align:center;}
/* ==== TOMBOL MASUK — PREMIUM FEEL ==== */
.login-btn{
  position:relative;
  width:100%;
  padding:16px 24px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg, #B3261E 0%, #8B1C16 100%);
  background-size:200% 200%;
  background-position:0% 50%;
  color:white;
  font-family:'Plus Jakarta Sans',inherit;
  font-size:0.98rem;
  font-weight:800;
  cursor:pointer;
  transition:all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:16px;
  letter-spacing:0.5px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(179,38,30,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  isolation:isolate;
  -webkit-font-smoothing:antialiased;
}

/* Glow ring (belakang tombol) */
.login-btn::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:16px;
  background:linear-gradient(135deg, #FF5A4E, #B3261E, #8B1C16, #FF5A4E);
  background-size:400% 400%;
  z-index:-1;
  opacity:0;
  transition:opacity 0.35s ease;
  animation:gradientShift 3s ease infinite;
}
.login-btn:hover::before{opacity:1;}
@keyframes gradientShift{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}

/* Shine sweep */
.login-btn::after{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
  transition:left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events:none;
}
.login-btn:hover::after{left:100%;}

.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(179,38,30,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
  letter-spacing:0.8px;
}

.login-btn:active{
  transform:translateY(0) scale(0.98);
  transition:all 0.1s;
  box-shadow:0 2px 8px rgba(179,38,30,0.3), inset 0 2px 4px rgba(0,0,0,0.15);
}

.login-btn:focus-visible{
  outline:none;
  box-shadow:0 0 0 4px rgba(179,38,30,0.2), 0 12px 28px rgba(179,38,30,0.35);
}

.login-btn svg{
  width:18px;
  height:18px;
  transition:transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.login-btn:hover svg{
  transform:translateX(3px) rotate(-5deg);
}

/* ==== RIPPLE EFFECT ==== */
.login-btn .ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,0.5);
  transform:scale(0);
  animation:rippleAnim 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events:none;
}
@keyframes rippleAnim{
  to{
    transform:scale(4);
    opacity:0;
  }
}

/* ==== LOADING STATE ==== */
.login-btn.loading{
  pointer-events:none;
  background:linear-gradient(135deg, #6B1410 0%, #4A0E0B 100%);
  box-shadow:0 4px 14px rgba(179,38,30,0.15);
}
.login-btn.loading::before{opacity:0;}
.login-btn.loading svg{
  animation:spinBtn 1s linear infinite;
  transform:none !important;
}
@keyframes spinBtn{
  to{transform:rotate(360deg);}
}
.login-btn.loading .btn-text::after{
  content:"...";
  animation:dots 1.4s steps(4) infinite;
}
@keyframes dots{
  0%{content:"";}
  25%{content:".";}
  50%{content:"..";}
  75%{content:"...";}
}

/* ==== SUCCESS STATE ==== */
.login-btn.success{
  background:linear-gradient(135deg, #10B981 0%, #059669 100%);
  pointer-events:none;
  box-shadow:0 12px 28px rgba(16,185,129,0.4);
}
.login-btn.success::before{opacity:0;}
.login-btn.success svg{
  transform:scale(1.1) !important;
  animation:successPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes successPop{
  0%{transform:scale(0);}
  60%{transform:scale(1.3);}
  100%{transform:scale(1.1);}
}

/* ==== SHAKE STATE (Error) ==== */
.login-btn.shake{
  animation:shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}
@keyframes shake{
  0%, 100%{transform:translateX(0);}
  10%, 30%, 50%, 70%, 90%{transform:translateX(-6px);}
  20%, 40%, 60%, 80%{transform:translateX(6px);}
}
.login-alert{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:0.83rem;font-weight:600;background:var(--danger-bg);color:var(--danger-text);border:1px solid #FECACA;display:flex;align-items:center;gap:8px;}
.login-alert svg{width:16px;height:16px;flex-shrink:0;}

/* ==== TOPBAR ==== */
.topbar{background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.topbar-inner{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-icon{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:white;display:flex;align-items:center;justify-content:center;}
.brand-icon svg{width:20px;height:20px;}
.brand-title{font-size:1rem;font-weight:800;line-height:1.2;}
.brand-sub{font-size:0.7rem;color:var(--text-tertiary);font-weight:500;}
.user-menu{display:flex;align-items:center;gap:10px;}
.user-chip{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 7px;background:#F5F5F7;border-radius:50px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:white;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:800;}
.user-name{font-size:0.8rem;font-weight:700;}
.user-role{font-size:0.66rem;color:var(--text-tertiary);font-weight:500;text-transform:uppercase;letter-spacing:0.4px;}
.logout-btn{width:34px;height:34px;border-radius:50%;background:white;border:1px solid var(--border-strong);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.15s;color:var(--text-secondary);}
.logout-btn:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-text);}
.logout-btn svg{width:15px;height:15px;}

/* ==== MAIN ==== */
.main{max-width:1100px;margin:0 auto;padding:28px 24px 80px;}

/* ==== HERO GURU ==== */
.hero{background:linear-gradient(135deg,#F5F3FF 0%,#EDE9FE 50%,#FCE7F3 100%);border-radius:22px;padding:32px 36px;margin-bottom:24px;border:1px solid var(--purple-border);position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;top:-60px;right:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(139,92,246,0.15) 0%,transparent 70%);pointer-events:none;}
.hero-greet{font-size:0.85rem;font-weight:700;color:#5B21B6;opacity:0.8;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;position:relative;z-index:1;}
.hero-name{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--purple-text);margin-bottom:8px;letter-spacing:-0.03em;position:relative;z-index:1;}
.hero-meta{font-size:0.85rem;color:#5B21B6;opacity:0.8;display:flex;gap:16px;flex-wrap:wrap;position:relative;z-index:1;}
.hero-meta span{display:inline-flex;align-items:center;gap:6px;}
.hero-meta svg{width:14px;height:14px;}

/* ==== GRID UTAMA ==== */
.grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:22px;align-items:start;}
@media (max-width:900px){.grid{grid-template-columns:1fr;}}

/* ==== KARTU UTAMA ==== */
.main-card{background:white;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-md);}
.main-card-hero{padding:36px 32px;text-align:center;position:relative;overflow:hidden;}
.main-card-hero.lulus{background:linear-gradient(135deg,#E7F6EE 0%,#D1FAE5 100%);}
.main-card-hero.cumlaude{background:linear-gradient(135deg,#FFF9E6 0%,#FDE68A 100%);}
.main-card-hero.belum{background:linear-gradient(135deg,#FFF4E5 0%,#FED7AA 100%);}
.main-card-hero.tidak{background:linear-gradient(135deg,#FEE2E2 0%,#FECACA 100%);}
.main-card-hero::before{content:"";position:absolute;top:-80px;right:-80px;width:240px;height:240px;background:rgba(255,255,255,0.5);border-radius:50%;pointer-events:none;}
.status-badge-huge{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:50px;font-size:0.85rem;font-weight:900;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:20px;position:relative;z-index:1;}
.status-badge-huge.lulus{background:linear-gradient(135deg,#10B981 0%,#059669 100%);color:white;box-shadow:0 8px 24px rgba(16,185,129,0.35);}
.status-badge-huge.cumlaude{background:linear-gradient(135deg,#D4A017 0%,#B8860B 100%);color:white;box-shadow:0 8px 24px rgba(212,160,23,0.4);}
.status-badge-huge.belum{background:linear-gradient(135deg,#F59E0B 0%,#D97706 100%);color:white;box-shadow:0 8px 24px rgba(245,158,11,0.35);}
.status-badge-huge.tidak{background:linear-gradient(135deg,#DC2626 0%,#991B1B 100%);color:white;box-shadow:0 8px 24px rgba(220,38,38,0.35);}
.status-badge-huge svg{width:18px;height:18px;}
.score-ring{width:170px;height:170px;margin:0 auto 20px;position:relative;z-index:1;}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.score-ring-bg{fill:none;stroke:rgba(255,255,255,0.5);stroke-width:11;}
.score-ring-fill{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1);}
.ring-lulus{stroke:#059669;}
.ring-cumlaude{stroke:#B8860B;}
.ring-belum{stroke:#D97706;}
.ring-tidak{stroke:#991B1B;}
.score-center{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.score-num{font-family:'Plus Jakarta Sans',sans-serif;font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-0.04em;color:#121217;}
.score-suffix{font-size:1rem;opacity:0.6;}
.score-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(0,0,0,0.5);margin-top:4px;}
.hero-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1;}
.btn-cert-main{padding:14px 28px;border-radius:12px;border:none;background:var(--success);color:white;font-family:inherit;font-size:0.95rem;font-weight:800;cursor:pointer;transition:0.15s;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 6px 20px rgba(16,185,129,0.3);letter-spacing:0.3px;}
.btn-cert-main:hover{background:#059669;transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,0.4);}
.btn-cert-main svg{width:17px;height:17px;}
.btn-cert-locked{padding:14px 28px;border-radius:12px;border:1.5px dashed #D1D5DB;background:#F3F4F6;color:#9CA3AF;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:not-allowed;display:inline-flex;align-items:center;gap:8px;letter-spacing:0.3px;}
.btn-cert-locked svg{width:17px;height:17px;}
.hint-text{font-size:0.75rem;color:var(--text-tertiary);margin-top:12px;font-style:italic;text-align:center;position:relative;z-index:1;line-height:1.5;}

/* ==== BREAKDOWN ==== */
.breakdown-wrap{padding:24px 32px 28px;}
.breakdown-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-tertiary);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.breakdown-title::after{content:"";flex:1;height:1px;background:var(--border);}
.bd-list{display:flex;flex-direction:column;gap:11px;}
.bd-item{display:flex;align-items:center;gap:12px;}
.bd-item-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bd-item-icon svg{width:15px;height:15px;}
.bd-item-icon.ok{background:var(--success-bg);color:var(--success-text);}
.bd-item-icon.warn{background:var(--warning-bg);color:var(--warning-text);}
.bd-item-icon.fail{background:var(--danger-bg);color:var(--danger-text);}
.bd-item-name{flex:1;min-width:0;}
.bd-item-label{font-size:0.85rem;font-weight:700;color:var(--text);margin-bottom:5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.bd-item-label small{font-size:0.72rem;font-weight:600;color:var(--text-tertiary);}
.bd-item-bar{height:6px;background:#F1F2F4;border-radius:50px;overflow:hidden;}
.bd-item-fill{height:100%;border-radius:50px;transition:width 1s cubic-bezier(0.4,0,0.2,1);}
.bd-item-fill.ok{background:linear-gradient(90deg,#10B981 0%,#059669 100%);}
.bd-item-fill.warn{background:linear-gradient(90deg,#FBBF24 0%,#F59E0B 100%);}
.bd-item-fill.fail{background:linear-gradient(90deg,#F87171 0%,#DC2626 100%);}

/* ==== SIDE PANEL ==== */
.side-panel{display:flex;flex-direction:column;gap:16px;}
.panel-card{background:white;border:1px solid var(--border);border-radius:18px;padding:22px;}
.panel-card-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:0.85rem;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.panel-card-title svg{width:16px;height:16px;color:var(--primary);}
.panel-card-sub{font-size:0.75rem;color:var(--text-tertiary);margin-bottom:14px;}
.todo-list{display:flex;flex-direction:column;gap:10px;}
.todo-item{display:flex;gap:11px;padding:12px 14px;background:var(--warning-bg);border:1px solid #FED7AA;border-radius:11px;align-items:flex-start;}
.todo-item.done{background:var(--success-bg);border-color:#A7F3D0;}
.todo-check{width:22px;height:22px;border-radius:50%;background:white;border:2px solid #F59E0B;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.todo-check svg{width:11px;height:11px;color:#F59E0B;}
.todo-item.done .todo-check{background:#10B981;border-color:#10B981;}
.todo-item.done .todo-check svg{color:white;}
.todo-text{flex:1;min-width:0;}
.todo-name{font-size:0.82rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.todo-desc{font-size:0.74rem;color:var(--text-secondary);line-height:1.5;}
.info-list{display:flex;flex-direction:column;gap:8px;font-size:0.82rem;}
.info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);}
.info-row:last-child{border-bottom:none;}
.info-label{color:var(--text-secondary);font-weight:600;}
.info-value{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;color:var(--text);}

/* ==== ADMIN VIEW ==== */
.admin-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px;}
@media (max-width:900px){.admin-kpi{grid-template-columns:repeat(2,1fr);}}
.kpi{background:white;border:1.5px solid var(--border);border-radius:16px;padding:18px;}
.kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.kpi-icon svg{width:18px;height:18px;}
.kpi-num{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.9rem;font-weight:800;line-height:1;letter-spacing:-0.03em;}
.kpi-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-tertiary);margin-top:4px;}
.kpi-lulus .kpi-icon{background:var(--success-bg);color:var(--success-text);} .kpi-lulus .kpi-num{color:var(--success-text);}
.kpi-cumlaude .kpi-icon{background:var(--gold-bg);color:#7A5500;} .kpi-cumlaude .kpi-num{color:#7A5500;}
.kpi-belum .kpi-icon{background:var(--warning-bg);color:var(--warning-text);} .kpi-belum .kpi-num{color:var(--warning-text);}
.kpi-tidak .kpi-icon{background:var(--danger-bg);color:var(--danger-text);} .kpi-tidak .kpi-num{color:var(--danger-text);}
.kpi-rate .kpi-icon{background:#E8F0FE;color:#1A56C4;} .kpi-rate .kpi-num{color:#1A56C4;}

.admin-filter{background:white;border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:220px;position:relative;}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-tertiary);pointer-events:none;}
.search-box input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--border-strong);border-radius:10px;font-family:inherit;font-size:0.85rem;outline:none;background:white;}

const API_URL = "https://script.google.com/macros/s/AKfycbxaaUcgZNBqJgCLbAtPRlikZG6t4ZGLFOY20ID7C3OiBoxlEUykpPgwWMHfFhWeckK-7g/exec";

let dataProgress = null;   // { meta, guru } / { meta, guru: { single } }

// ==================== UTILS ====================
function initials(n){
  const p = String(n||"?").trim().split(/\s+/);
  if(!p.length) return "?";
  if(p.length === 1) return p[0].substring(0,2).toUpperCase();
  return (p[0][0]+p[p.length-1][0]).toUpperCase();
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ==================== BUTTON HELPERS ====================
function setBtnState(state, text, icon) {
  const btn = document.getElementById("btn-login");
  const txt = document.getElementById("btn-login-text");
  const ico = document.getElementById("btn-login-icon");
  if(!btn) return;

  btn.classList.remove("loading", "success", "shake");

  if(state === "loading") {
    btn.classList.add("loading");
    txt.innerText = "Memverifikasi";
    ico.setAttribute("data-lucide", "loader-2");
  } else if(state === "success") {
    btn.classList.add("success");
    txt.innerText = "Berhasil";
    ico.setAttribute("data-lucide", "check");
  } else {
    txt.innerText = text || "Masuk";
    ico.setAttribute("data-lucide", icon || "log-in");
  }

  if(window.lucide) lucide.createIcons();
}

function shakeBtn() {
  const btn = document.getElementById("btn-login");
  if(!btn) return;
  btn.classList.add("shake");
  setTimeout(() => btn.classList.remove("shake"), 500);
}

// ==================== RIPPLE EFFECT ====================
function attachRipple() {
  const btn = document.getElementById("btn-login");
  if(!btn) return;
  btn.addEventListener("click", function(e) {
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = x + "px";
    ripple.style.top = y + "px";
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });
}

// ==================== HANDLE LOGIN (PREMIUM) ====================
async function handleLogin(e){
  e.preventDefault();
  const pin = document.getElementById("inp-pin").value.trim();
  const alertBox = document.getElementById("login-alert");
  const alertMsg = document.getElementById("login-alert-msg");
  alertBox.classList.add("hidden");

  // Validasi cepat
  if(!pin || pin.length < 5){
    alertMsg.innerText = "PIN harus minimal 5 digit";
    alertBox.classList.remove("hidden");
    shakeBtn();
    return;
  }

  // Set loading state
  setBtnState("loading");

  // Delay kecil biar animasi loading kelihatan (UX feel)
  const startTime = Date.now();

  try {
    const res = await fetch(API_URL + "?action=login&pin=" + encodeURIComponent(pin));
    const data = await res.json();

    // Minimum delay 600ms biar user bisa lihat loading-nya
    const elapsed = Date.now() - startTime;
    if(elapsed < 600) {
      await new Promise(r => setTimeout(r, 600 - elapsed));
    }

    if(data.error){
      setBtnState("reset");
      alertMsg.innerText = data.error;
      alertBox.classList.remove("hidden");
      shakeBtn();
      return;
    }
    if(!data.ok){
      setBtnState("reset");
      alertMsg.innerText = "Login gagal";
      alertBox.classList.remove("hidden");
      shakeBtn();
      return;
    }

    // Success state
    setBtnState("success");
    currentUser = data.guru;
    saveSession(currentUser);

    // Tunggu sebentar biar user lihat centangnya
    await new Promise(r => setTimeout(r, 700));
    document.getElementById("inp-pin").value = "";
    setBtnState("reset");
    await loadDashboard();

  } catch (err) {
    setBtnState("reset");
    alertMsg.innerText = "Gagal koneksi: " + err.message;
    alertBox.classList.remove("hidden");
    shakeBtn();
  }
}

function logout(){
  clearSession();
  currentUser = null;
  dataProgress = null;
  adminAllData = null;
  showView("login");
  showToast("Berhasil logout");
}

// ==================== LOAD DASHBOARD ====================
async function loadDashboard(){
  const cacheKey = CACHE_KEY + "2026_" + (currentUser.isAdmin ? "all" : currentUser.pin);
  let cached = null;
  try {
    const c = localStorage.getItem(cacheKey);
    if(c){
      const obj = JSON.parse(c);
      if(Date.now() - obj.ts < CACHE_TTL) cached = obj.data;
    }
  } catch(e){}

  if(cached){
    dataProgress = cached;
  } else {
    try {
      const url = currentUser.isAdmin
        ? `${API_URL}?action=getProgressGuru&tahun=2026`
        : `${API_URL}?action=getProgressGuru&tahun=2026&pin=${encodeURIComponent(currentUser.pin)}`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      dataProgress = data;
      localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data }));
    } catch (err) {
      showToast("Gagal load data: " + err.message);
      return;
    }
  }

  // Update user chip
  document.getElementById("user-avatar").innerText = initials(currentUser.nama);
  document.getElementById("user-name").innerText = currentUser.nama.split(",")[0];
  document.getElementById("user-role").innerText = currentUser.isAdmin ? "Admin" : "Guru";

  showView("dashboard");
  setupTabs();
  refreshPersetujuanBadge();
  if(currentUser.isAdmin && dataProgress.guru && Array.isArray(dataProgress.guru)){
    document.getElementById("tab-capaian").innerHTML = "";
    document.getElementById("tabs-bar").classList.add("hidden");
    renderAdmin();
  } else {
    renderGuru();
  }
}

// ==================== SETUP TABS ====================
function setupTabs() {
  const tabsBar = document.getElementById("tabs-bar");
  const tabsInner = document.getElementById("tabs-inner");
  if (!tabsBar || !tabsInner) return;

  if (currentUser.isAdmin) {
    tabsBar.classList.add("hidden");
    return;
  }
  tabsBar.classList.remove("hidden");

  const isKS = /kepala\s*sekolah|^ks\b|kepsek/i.test(currentUser.jabatan || "");
  const tabs = isKS
    ? [
        { id: "capaian", label: "Capaian Saya", icon: "award" },
        { id: "persetujuan", label: "Persetujuan Bypass", icon: "check-circle", badge: "info" }
      ]
    : [
        { id: "capaian", label: "Capaian Saya", icon: "award" },
        { id: "bypass", label: "Bypass Kehadiran", icon: "shield-plus" }
      ];

  tabsInner.innerHTML = tabs.map((t, i) =>
    '<button class="tab-btn' + (i === 0 ? ' active' : '') + '" data-tab="' + t.id +
    '" onclick="switchTab(\'' + t.id + '\', this)"><i data-lucide="' + t.icon + '"></i> ' +
    t.label + (t.badge ? '<span class="tab-badge ' + t.badge + '">!</span>' : '') + '</button>'
  ).join("");

  if (window.lucide) lucide.createIcons();
}

function switchTab(name, btn) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  const panel = document.getElementById("tab-" + name);
  if (panel) panel.classList.add("active");

  if (name === "bypass") loadBypassData();
  if (name === "persetujuan") loadPersetujuanData();

  window.scrollTo({ top: 0, behavior: "smooth" });
  if (window.lucide) lucide.createIcons();
}

// ==================== BYPASS GURU ====================
async function loadBypassData() {
  const container = document.getElementById("tab-bypass");
  container.innerHTML = '<div class="empty-state-sm"><p>Memuat data...</p></div>';
  try {
    const [resSesi, resRiwayat] = await Promise.all([
      fetch(API_URL + "?action=getSesiBolongGuru&tahun=2026&pin=" + encodeURIComponent(currentUser.pin)),
      fetch(API_URL + "?action=getPengajuanGuru&tahun=2026&pin=" + encodeURIComponent(currentUser.pin))
    ]);
    const dataSesi = await resSesi.json();
    const dataRiwayat = await resRiwayat.json();
    if (dataSesi.error) throw new Error(dataSesi.error);
    if (dataRiwayat.error) throw new Error(dataRiwayat.error);
    sesiBolongData = dataSesi;
    pengajuanGuruData = dataRiwayat;
    selectedSesi = {};
    renderBypass();
  } catch (err) {
    container.innerHTML = '<div class="empty-state-sm"><h3 style="color:#DC2626;">Gagal Memuat</h3><p>' + escapeHtml(err.message) + '</p></div>';
  }
}

function renderBypass() {
  const sesi = (sesiBolongData && sesiBolongData.sesiBolong) || [];
  const riwayat = (pengajuanGuruData && pengajuanGuruData.list) || [];
  const jumlahPending = riwayat.filter(r => r.status === "pending_ks" || r.status === "approved_ks").length;

  const html = `
    <div class="hero" style="background:linear-gradient(135deg,#FEF2F2,#FEE2E2);border-color:#FCA5A5;">
      <div class="hero-greet" style="color:#991B1B;">Pengajuan Bypass</div>
      <div class="hero-name" style="color:#7F1D1D;">Bypass Kehadiran KKG</div>
      <div class="hero-meta" style="color:#991B1B;">
        <span><i data-lucide="calendar-x"></i> <strong>${sesi.length}</strong> sesi belum diajukan</span>
        <span><i data-lucide="target"></i> Max 4 sesi per pengajuan</span>
        <span><i data-lucide="info"></i> Persetujuan 3 lapis</span>
      </div>
    </div>

    ${sesi.length > 0 ? renderSesiTable(sesi) : renderNoSesi()}
    ${riwayat.length > 0 ? renderRiwayat(riwayat, jumlahPending) : ""}
  `;

  document.getElementById("tab-bypass").innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

function renderNoSesi() {
  return `
    <div class="empty-state-sm">
      <i data-lucide="check-circle"></i>
      <h3>Tidak Ada Sesi Bolong</h3>
      <p>Anda sudah menghadiri semua sesi KKG, atau semua sesi bolong sudah diajukan.</p>
    </div>`;
}

function renderSesiTable(sesiList) {
  const POIN_PER_SESI = 100;
  const rows = sesiList.map(s => {
    const checked = selectedSesi[s.tanggal] ? " selected" : "";
    return `
      <div class="sesi-item${checked}" data-tgl="${escapeHtml(s.tanggal)}" onclick="toggleSesi('${escapeHtml(s.tanggal)}', this)">
        <div class="sesi-checkbox"><i data-lucide="check"></i></div>
        <div class="sesi-info">
          <div class="sesi-tanggal">${escapeHtml(s.tanggalFormatted)}</div>
          <div class="sesi-materi">${escapeHtml(s.materi)}</div>
        </div>
        <span class="sesi-status">${escapeHtml(s.statusDiPresensi || "Tidak Hadir")}</span>
      </div>`;
  }).join("");

  return `
    <div class="sesi-card">
      <div class="sesi-card-title"><i data-lucide="list-checks"></i> Sesi KKG yang Tidak Anda Hadiri</div>
      <div class="sesi-card-sub">Pilih sesi yang akan diajukan untuk bypass. Setelah KS & Ketua Gugus menyetujui, poin kehadiran akan bertambah otomatis.</div>
      <div class="sesi-list">${rows}</div>
      <div class="sesi-summary">
        <div class="sesi-summary-text">
          Dipilih: <strong id="sesi-count">0</strong> sesi
        </div>
        <div class="sesi-summary-text">
          Poin: <strong id="sesi-poin">0</strong> poin
        </div>
        <button class="btn-submit-bypass" id="btn-open-form" disabled onclick="openBypassForm()">
          <i data-lucide="send"></i> Ajukan Bypass
        </button>
      </div>
    </div>`;
}

function toggleSesi(tgl, el) {
  if (selectedSesi[tgl]) {
    delete selectedSesi[tgl];
    el.classList.remove("selected");
  } else {
    const sesi = sesiBolongData.sesiBolong.find(s => s.tanggal === tgl);
    if (!sesi) return;
    if (Object.keys(selectedSesi).length >= 4) {
      showToast("Maksimal 4 sesi per pengajuan");
      return;
    }
    selectedSesi[tgl] = sesi;
    el.classList.add("selected");
  }
  updateSummary();
  if (window.lucide) lucide.createIcons();
}

function updateSummary() {
  const count = Object.keys(selectedSesi).length;
  const countEl = document.getElementById("sesi-count");
  const poinEl = document.getElementById("sesi-poin");
  const btn = document.getElementById("btn-open-form");
  if (countEl) countEl.innerText = count;
  if (poinEl) poinEl.innerText = count * 100;
  if (btn) btn.disabled = count === 0;
}

function openBypassForm() {
  const count = Object.keys(selectedSesi).length;
  if (count === 0) { showToast("Pilih minimal 1 sesi"); return; }
  const sesiArr = Object.values(selectedSesi);
  const listHtml = sesiArr.map(s =>
    '<div style="padding:8px 12px;background:#FEF3F2;border-radius:8px;font-size:0.82rem;margin-bottom:6px;">' +
    '<strong>' + escapeHtml(s.tanggalFormatted) + '</strong> — ' + escapeHtml(s.materi) + '</div>'
  ).join("");

  const kategoriOpts = [
    "Tugas Kedinasan Sekolah",
    "Dinas Luar",
    "Sakit (dengan surat dokter)",
    "Lain-lain"
  ].map(k => '<option value="' + k + '">' + k + '</option>').join("");

  document.getElementById("modal-bypass-body").innerHTML = `
    <div class="form-group-sm">
      <label class="form-label-sm">Sesi yang Diajukan</label>
      <div>${listHtml}</div>
      <div style="font-size:0.78rem;color:var(--text-tertiary);margin-top:6px;">
        ${count} sesi × 100 poin = <strong>${count * 100} poin</strong>
      </div>
    </div>

    <div class="form-group-sm">
      <label class="form-label-sm">Kategori Alasan <span class="req">*</span></label>
      <select class="form-input-sm" id="byp-kategori">
        <option value="">— Pilih kategori —</option>
        ${kategoriOpts}
      </select>
    </div>

    <div class="form-group-sm">
      <label class="form-label-sm">Detail Alasan <span class="req">*</span> <span style="font-weight:500;text-transform:none;letter-spacing:0;">(min 30 karakter)</span></label>
      <textarea class="form-input-sm" id="byp-detail" rows="4" placeholder="Contoh: Saya ditugaskan mendampingi siswa lomba OSN tingkat kabupaten pada 2 sesi KKG. Sudah ada SK dari kepala sekolah."></textarea>
    </div>

    <div class="form-group-sm">
      <label class="form-label-sm">Link Bukti (Google Drive — opsional)</label>
      <input type="url" class="form-input-sm" id="byp-bukti" placeholder="https://drive.google.com/...">
    </div>

    <div class="info-box-sm">
      <i data-lucide="info"></i>
      <div>Pengajuan akan dikirim ke <strong>KS ${escapeHtml(currentUser.sekolah)}</strong> untuk verifikasi, lalu ke Ketua Gugus untuk approval final.</div>
    </div>
  `;
  document.getElementById("modal-bypass").classList.add("show");
  document.body.style.overflow = "hidden";
  if (window.lucide) lucide.createIcons();
}

function closeBypassModal() {
  document.getElementById("modal-bypass").classList.remove("show");
  document.body.style.overflow = "";
}

async function submitBypass() {
  const kategori = document.getElementById("byp-kategori").value;
  const detail = document.getElementById("byp-detail").value.trim();
  const bukti = document.getElementById("byp-bukti").value.trim();

  if (!kategori) { showToast("Pilih kategori alasan"); return; }
  if (detail.length < 30) { showToast("Detail minimal 30 karakter"); return; }

  const btn = document.getElementById("btn-submit-bypass");
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2"></i> Mengirim...';
  if (window.lucide) lucide.createIcons();

  try {
    const payload = {
      action: "ajukanBypass",
      pin: currentUser.pin,
      tahun: "2026",
      sesiBolong: Object.values(selectedSesi),
      kategoriAlasan: kategori,
      detailAlasan: detail,
      buktiLink: bukti
    };
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.error) { showToast(data.error); btn.disabled = false; btn.innerHTML = '<i data-lucide="send"></i> Kirim ke KS'; if (window.lucide) lucide.createIcons(); return; }

    showToast("Pengajuan terkirim ke KS ✅");
    closeBypassModal();
    selectedSesi = {};
    await loadBypassData();
  } catch (err) {
    showToast("Gagal: " + err.message);
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="send"></i> Kirim ke KS';
    if (window.lucide) lucide.createIcons();
  }
}

function renderRiwayat(list, jumlahPending) {
  const statusMap = {
    pending_ks: { label: "Menunggu KS", icon: "clock", cls: "pending_ks" },
    approved_ks: { label: "Menunggu Gugus", icon: "arrow-right", cls: "approved_ks" },
    rejected_ks: { label: "Ditolak KS", icon: "x-circle", cls: "rejected_ks" },
    approved: { label: "Disetujui", icon: "check-circle", cls: "approved" },
    rejected: { label: "Ditolak", icon: "x-circle", cls: "rejected" },
    revoked: { label: "Dibatalkan", icon: "rotate-ccw", cls: "revoked" }
  };

  const items = list.map(r => {
    const st = statusMap[r.status] || { label: r.status, icon: "help-circle", cls: "" };
    const sesiList = (r.sesiBolong || []).map(s => s.tanggalFormatted || s.tanggal).join(" · ");
    const detailParts = [
      '<div><strong>' + r.jumlahSesi + ' sesi</strong> · ' + escapeHtml(r.kategoriAlasan) + '</div>',
      '<div style="font-size:0.72rem;">' + escapeHtml(sesiList) + '</div>'
    ];
    if (r.ksNama) detailParts.push('<div style="font-size:0.72rem;">KS: ' + escapeHtml(r.ksNama) + (r.ksCatatan ? ' — "' + escapeHtml(r.ksCatatan) + '"' : '') + '</div>');
    if (r.gugusNama) detailParts.push('<div style="font-size:0.72rem;">Gugus: ' + escapeHtml(r.gugusNama) + (r.gugusCatatan ? ' — "' + escapeHtml(r.gugusCatatan) + '"' : '') + '</div>');

    return `
      <div class="riwayat-card status-${r.status}">
        <div class="riwayat-head">
          <div class="riwayat-title">
            ${escapeHtml(r.id)}
            <small>Diajukan: ${formatTanggal(r.tanggalSubmit || r.timestamp)}</small>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <div class="riwayat-poin">+${r.poinFinal || r.poinDiajukan} poin</div>
            <span class="riwayat-status ${st.cls}"><i data-lucide="${st.icon}"></i> ${st.label}</span>
          </div>
        </div>
        <div class="riwayat-detail">${detailParts.join("")}</div>
        ${r.status === "rejected_ks" ? '<div class="riwayat-actions"><button class="btn-sm" onclick="editPengajuan(\'' + r.id + '\')"><i data-lucide="edit-3"></i> Edit & Ajukan Ulang</button></div>' : ''}
      </div>`;
  }).join("");

  return `
    <div style="margin-top:24px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h3 style="font-family:'Plus Jakarta Sans';font-size:1rem;font-weight:800;">Riwayat Pengajuan</h3>
        <span style="font-size:0.78rem;color:var(--text-tertiary);">${list.length} pengajuan</span>
      </div>
      ${items}
    </div>`;
}

function formatTanggal(d) {
  try {
    const dt = new Date(d);
    return dt.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
  } catch (e) { return "-"; }
}

function editPengajuan(id) {
  if (!pengajuanGuruData) return;
  const item = pengajuanGuruData.list.find(r => r.id === id);
  if (!item) return;
  selectedSesi = {};
  (item.sesiBolong || []).forEach(s => { selectedSesi[s.tanggal] = s; });
  // isi ulang form dengan data lama
  const sesiArr = item.sesiBolong || [];
  const listHtml = sesiArr.map(s =>
    '<div style="padding:8px 12px;background:#FEF3F2;border-radius:8px;font-size:0.82rem;margin-bottom:6px;">' +
    '<strong>' + escapeHtml(s.tanggalFormatted || s.tanggal) + '</strong> — ' + escapeHtml(s.materi) + '</div>'
  ).join("");
  const kategoriOpts = ["Tugas Kedinasan Sekolah", "Dinas Luar", "Sakit (dengan surat dokter)", "Lain-lain"]
    .map(k => '<option value="' + k + '"' + (k === item.kategoriAlasan ? ' selected' : '') + '>' + k + '</option>').join("");

  document.getElementById("modal-bypass-body").innerHTML = `
    <div class="form-group-sm">
      <label class="form-label-sm">Sesi yang Diajukan</label>
      <div>${listHtml}</div>
    </div>
    <div class="form-group-sm">
      <label class="form-label-sm">Kategori Alasan <span class="req">*</span></label>
      <select class="form-input-sm" id="byp-kategori"><option value="">— Pilih —</option>${kategoriOpts}</select>
    </div>
    <div class="form-group-sm">
      <label class="form-label-sm">Detail Alasan <span class="req">*</span> (min 30 karakter)</label>
      <textarea class="form-input-sm" id="byp-detail" rows="4">${escapeHtml(item.detailAlasan)}</textarea>
    </div>
    <div class="form-group-sm">
      <label class="form-label-sm">Link Bukti (opsional)</label>
      <input type="url" class="form-input-sm" id="byp-bukti" value="${escapeHtml(item.buktiLink || "")}">
    </div>
    <div class="info-box-sm">
      <i data-lucide="info"></i>
      <div>Mengedit pengajuan akan reset status ke <strong>Menunggu KS</strong>. Silakan perbaiki data & kirim ulang.</div>
    </div>
    <input type="hidden" id="byp-edit-id" value="${escapeHtml(id)}">
  `;

  const btn = document.getElementById("btn-submit-bypass");
  btn.innerHTML = '<i data-lucide="refresh-cw"></i> Kirim Ulang ke KS';
  btn.onclick = submitEditBypass;

  document.getElementById("modal-bypass").classList.add("show");
  document.body.style.overflow = "hidden";
  if (window.lucide) lucide.createIcons();
}

async function submitEditBypass() {
  const id = document.getElementById("byp-edit-id").value;
  const kategori = document.getElementById("byp-kategori").value;
  const detail = document.getElementById("byp-detail").value.trim();
  const bukti = document.getElementById("byp-bukti").value.trim();
  if (!kategori) { showToast("Pilih kategori"); return; }
  if (detail.length < 30) { showToast("Detail min 30 char"); return; }

  const btn = document.getElementById("btn-submit-bypass");
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2"></i> Mengirim...';
  if (window.lucide) lucide.createIcons();

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "editPengajuan",
        id: id,
        pin: currentUser.pin,
        sesiBolong: Object.values(selectedSesi),
        kategoriAlasan: kategori,
        detailAlasan: detail,
        buktiLink: bukti
      })
    });
    const data = await res.json();
    if (data.error) { showToast(data.error); btn.disabled = false; btn.innerHTML = '<i data-lucide="refresh-cw"></i> Kirim Ulang'; if (window.lucide) lucide.createIcons(); return; }
    showToast("Pengajuan dikirim ulang ✅");
    closeBypassModal();
    selectedSesi = {};
    // reset button
    const mainBtn = document.getElementById("btn-submit-bypass");
    if (mainBtn) mainBtn.onclick = submitBypass;
    await loadBypassData();
  } catch (err) {
    showToast("Gagal: " + err.message);
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="refresh-cw"></i> Kirim Ulang';
    if (window.lucide) lucide.createIcons();
  }
}

// ==================== PERSETUJUAN KS (FASE 3) ====================
async function refreshPersetujuanBadge() {
  if (!currentUser || currentUser.isAdmin) return;
  const isKS = /kepala\s*sekolah|^ks\b|kepsek/i.test(currentUser.jabatan || "");

  try {
    const res = await fetch(API_URL + "?action=getPengajuanKS&tahun=2026&pinKS=" + encodeURIComponent(currentUser.pin));

    if (!data.error) updatePersetujuanBadge(data.totalPending || 0);

function updatePersetujuanBadge(count) {
  document.querySelectorAll('.tab-badge.info').forEach(b => {

      b.textContent = count;
      b.style.display = '';
    } else {
      b.style.display = 'none';
    }

}

async function loadPersetujuanData() {
  const container = document.getElementById("tab-persetujuan");
  container.innerHTML = '<div class="empty-state-sm"><p>Memuat data persetujuan...</p></div>';
  try {
    const res = await fetch(API_URL + "?action=getPengajuanKS&tahun=2026&pinKS=" + encodeURIComponent(currentUser.pin));

  const riwayatHtml = riwayat.length
    ? riwayat.map(r => renderRiwayatKS(r)).join("")
    : '<div class="empty-state-sm"><p>Belum ada riwayat persetujuan.</p></div>';

  const html = `
    <div class="hero" style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-color:#93C5FD;">
      <div class="hero-greet" style="color:#1E40AF;">Persetujuan Bypass</div>
      <div class="hero-name" style="color:#1E3A8A;">Verifikasi Pengajuan Guru</div>
      <div class="hero-meta" style="color:#1E40AF;">

        <span><i data-lucide="clock"></i> <strong>${pending.length}</strong> menunggu</span>
        <span><i data-lucide="check-circle"></i> <strong>${totalApproved}</strong> disetujui</span>
      </div>
    </div>

    <div class="admin-kpi">
      <div class="kpi kpi-belum"><div class="kpi-icon"><i data-lucide="clock"></i></div><div class="kpi-num">${pending.length}</div><div class="kpi-label">Menunggu</div></div>
      <div class="kpi kpi-lulus"><div class="kpi-icon"><i data-lucide="check-circle"></i></div><div class="kpi-num">${totalApproved}</div><div class="kpi-label">Disetujui</div></div>
      <div class="kpi kpi-tidak"><div class="kpi-icon"><i data-lucide="x-circle"></i></div><div class="kpi-num">${totalRejected}</div><div class="kpi-label">Ditolak</div></div>
    </div>

    <div class="ks-info-box">
      <i data-lucide="info"></i>
      <div>Sebagai Kepala Sekolah, Anda memverifikasi pengajuan guru di sekolah Anda. Setelah Anda setujui, pengajuan akan diteruskan ke Ketua Gugus untuk approval final.</div>
    </div>

    <div class="ks-section-title">
      <i data-lucide="clock" style="color:var(--warning);"></i>
      Menunggu Persetujuan
      <span class="count">${pending.length}</span>
    </div>
    ${pendingHtml}

    <div class="ks-section-title" style="margin-top:32px;">
      <i data-lucide="history" style="color:var(--text-tertiary);"></i>
      Riwayat Persetujuan
      <span class="count">${riwayat.length}</span>
    </div>
    ${riwayatHtml}
  `;

  document.getElementById("tab-persetujuan").innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

function renderPendingKS(r) {
  const sesiList = (r.sesiBolong || [])
    .map(s => s.tanggalFormatted || s.tanggal)
    .join(" · ");
  const buktiHtml = r.buktiLink
    ? '<div>🔗 Bukti: <a href="' + escapeHtml(r.buktiLink) + '" target="_blank" rel="noopener">Lihat Dokumen</a></div>'
    : '<div style="color:var(--text-tertiary);">🔗 Bukti: tidak dilampirkan</div>';

  return `
    <div class="ks-pending-card">
      <div class="ks-pending-head">
        <div>
          <div class="ks-pending-name">${escapeHtml(r.nama)}</div>
          <div class="ks-pending-meta">${escapeHtml(r.sekolah)} · ${r.jumlahSesi} sesi</div>
        </div>
        <div class="ks-pending-badge">+${r.poinDiajukan} poin</div>
      </div>
      <div class="ks-pending-body">
        <div>📅 <strong>${escapeHtml(sesiList)}</strong></div>
        <div>📂 <strong>${escapeHtml(r.kategoriAlasan)}</strong></div>
        <div>📝 ${escapeHtml(r.detailAlasan)}</div>
        ${buktiHtml}
        <div style="font-size:0.72rem;color:var(--text-tertiary);margin-top:4px;">
          Diajukan: ${formatTanggal(r.tanggalSubmit || r.timestamp)} · ID: ${escapeHtml(r.id)}
        </div>
      </div>
      <div class="ks-pending-actions">
        <button class="ks-btn approve" onclick="openApproveKS('${escapeHtml(r.id)}')">
          <i data-lucide="check"></i> Setujui
        </button>
        <button class="ks-btn reject" onclick="openRejectKS('${escapeHtml(r.id)}')">
          <i data-lucide="x"></i> Tolak
        </button>
      </div>
    </div>`;
}

function renderRiwayatKS(r) {
  const statusMap = {
    approved_ks: { label: "Anda Setujui", icon: "arrow-right", cls: "approved_ks" },
    rejected_ks: { label: "Anda Tolak", icon: "x-circle", cls: "rejected_ks" },
    approved: { label: "Disetujui Final", icon: "check-circle", cls: "approved" },
    rejected: { label: "Ditolak Final", icon: "x-circle", cls: "rejected" },
    revoked: { label: "Dibatalkan", icon: "rotate-ccw", cls: "revoked" }
  };
  const st = statusMap[r.status] || { label: r.status, icon: "help-circle", cls: "" };
  const sesiList = (r.sesiBolong || []).map(s => s.tanggalFormatted || s.tanggal).join(" · ");

  const detailParts = [
    '<div><strong>' + r.nama + '</strong> · ' + r.jumlahSesi + ' sesi</div>',
    '<div style="font-size:0.72rem;">' + escapeHtml(sesiList) + '</div>',
    '<div style="font-size:0.72rem;">Alasan: ' + escapeHtml(r.kategoriAlasan) + '</div>'
  ];
  if (r.ksCatatan) detailParts.push('<div style="font-size:0.72rem;">Catatan Anda: "' + escapeHtml(r.ksCatatan) + '"</div>');
  if (r.gugusNama) detailParts.push('<div style="font-size:0.72rem;">Gugus: ' + escapeHtml(r.gugusNama) + (r.gugusCatatan ? ' — "' + escapeHtml(r.gugusCatatan) + '"' : '') + '</div>');

  return `
    <div class="riwayat-card status-${r.status}">
      <div class="riwayat-head">
        <div class="riwayat-title">
          ${escapeHtml(r.id)}
          <small>Diajukan: ${formatTanggal(r.tanggalSubmit || r.timestamp)}</small>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div class="riwayat-poin">+${r.poinFinal || r.poinDiajukan} poin</div>
          <span class="riwayat-status ${st.cls}"><i data-lucide="${st.icon}"></i> ${st.label}</span>
        </div>
      </div>
      <div class="riwayat-detail">${detailParts.join("")}</div>
    </div>`;
}

// === APPROVE MODAL ===
function openApproveKS(id) {
  if (!ksData) return;
  const item = ksData.pending.find(r => r.id === id);
  if (!item) return;
  currentKSItem = item;
  currentKSAction = "approve";

  document.getElementById("modal-ks-title").innerText = "Setujui Pengajuan Bypass";
  document.getElementById("modal-ks-body").innerHTML = `
    <div style="padding:14px;background:#F0FDF4;border:1px solid #A7F3D0;border-radius:12px;margin-bottom:16px;">
      <div style="font-weight:800;font-size:0.95rem;margin-bottom:4px;">${escapeHtml(item.nama)}</div>
      <div style="font-size:0.78rem;color:#065F46;">${escapeHtml(item.sekolah)} · ${item.jumlahSesi} sesi · +${item.poinDiajukan} poin</div>
    </div>
    <div style="padding:12px;background:#F8F9FB;border-radius:10px;margin-bottom:16px;font-size:0.82rem;line-height:1.6;color:var(--text-secondary);">
      <div><strong>Alasan:</strong> ${escapeHtml(item.kategoriAlasan)}</div>
      <div style="margin-top:6px;">${escapeHtml(item.detailAlasan)}</div>
    </div>
    <div class="form-group-sm">
      <label class="form-label-sm">Catatan Anda (opsional)</label>
      <textarea class="form-input-sm" id="ks-catatan" rows="3" placeholder="Contoh: Sudah verifikasi, SK OSN terlampir."></textarea>
    </div>
    <div class="info-box-sm">
      <i data-lucide="info"></i>
      <div>Setelah disetujui, pengajuan akan diteruskan ke <strong>Ketua Gugus Nakula</strong> untuk approval final. Poin belum masuk sampai disetujui Gugus.</div>
    </div>
  `;
  const btn = document.getElementById("btn-submit-ks");
  btn.innerHTML = '<i data-lucide="check"></i> Ya, Setujui';
  btn.className = "btn btn-primary";
  btn.style.background = "var(--success)";
  btn.style.borderColor = "var(--success)";
  btn.onclick = () => submitKSDecision();

  document.getElementById("modal-ks").classList.add("show");
  document.body.style.overflow = "hidden";
  if (window.lucide) lucide.createIcons();
}

// === REJECT MODAL ===
function openRejectKS(id) {
  if (!ksData) return;
  const item = ksData.pending.find(r => r.id === id);
  if (!item) return;
  currentKSItem = item;
  currentKSAction = "reject";

  document.getElementById("modal-ks-title").innerText = "Tolak Pengajuan Bypass";
  document.getElementById("modal-ks-body").innerHTML = `
    <div style="padding:14px;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;margin-bottom:16px;">
      <div style="font-weight:800;font-size:0.95rem;margin-bottom:4px;">${escapeHtml(item.nama)}</div>
      <div style="font-size:0.78rem;color:#991B1B;">${escapeHtml(item.sekolah)} · ${item.jumlahSesi} sesi · +${item.poinDiajukan} poin</div>
    </div>
    <div class="form-group-sm">
      <label class="form-label-sm">Alasan Penolakan <span class="req">*</span> <span style="font-weight:500;text-transform:none;letter-spacing:0;">(min 10 karakter)</span></label>
      <textarea class="form-input-sm" id="ks-catatan" rows="4" placeholder="Contoh: Bukti tidak ada tanda tangan KS. Mohon lengkapi dokumen."></textarea>
    </div>
    <div class="info-box-sm" style="background:#FEF2F2;border-color:#FECACA;color:#991B1B;">
      <i data-lucide="alert-triangle"></i>
      <div>Guru akan menerima alasan penolakan Anda dan bisa <strong>mengedit & mengajukan ulang</strong> dengan perbaikan.</div>
    </div>
  `;
  const btn = document.getElementById("btn-submit-ks");
  btn.innerHTML = '<i data-lucide="x"></i> Ya, Tolak';
  btn.className = "btn btn-primary";
  btn.style.background = "var(--danger)";
  btn.style.borderColor = "var(--danger)";
  btn.onclick = () => submitKSDecision();

  document.getElementById("modal-ks").classList.add("show");
  document.body.style.overflow = "hidden";
  if (window.lucide) lucide.createIcons();
}

function closeKSModal() {
  document.getElementById("modal-ks").classList.remove("show");
  document.body.style.overflow = "";
  currentKSItem = null;
  currentKSAction = null;
}

async function submitKSDecision() {
  if (!currentKSItem || !currentKSAction) return;
  const catatan = (document.getElementById("ks-catatan") || {}).value || "";
  const catatanTrim = catatan.trim();

  if (currentKSAction === "reject" && catatanTrim.length < 10) {
    showToast("Alasan penolakan minimal 10 karakter");
    return;
  }

  const btn = document.getElementById("btn-submit-ks");
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2"></i> Memproses...';
  if (window.lucide) lucide.createIcons();

  try {
    const action = currentKSAction === "approve" ? "approveKS" : "rejectKS";
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: action,
        id: currentKSItem.id,
        catatan: catatanTrim,
        pinKS: currentUser.pin
      })
    });
    const data = await res.json();
    if (data.error) {
      showToast(data.error);
      btn.disabled = false;
      btn.innerHTML = originalHtml;
      if (window.lucide) lucide.createIcons();
      return;
    }

    showToast(currentKSAction === "approve" ? "Disetujui — diteruskan ke Ketua Gugus ✅" : "Pengajuan ditolak");
    closeKSModal();
    await loadPersetujuanData();
  } catch (err) {
    showToast("Gagal: " + err.message);
    btn.disabled = false;
    btn.innerHTML = originalHtml;
    if (window.lucide) lucide.createIcons();
  }
}

// ==================== INIT ====================
document.addEventListener("DOMContentLoaded", async () => {
  if(window.lucide) lucide.createIcons();
  attachRipple();
  const session = loadSession();
  if(session && session.pin){
    currentUser = session;
    await loadDashboard();
  } else {
    showView("login");
  }
});
</script>
